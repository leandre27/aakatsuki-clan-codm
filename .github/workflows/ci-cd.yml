# Intégration et déploiement continus
# - Chaque push et chaque pull request : tests.
# - Push sur main : copie de la nouvelle version sur le VPS (site Node.js CloudPanel),
#   redémarrage avec pm2 et vérification que le site répond, sinon retour à la version précédente.
name: CI/CD
# Actions épinglées sur un commit précis (mises à jour proposées par Dependabot)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: aakatsuki_test
          MYSQL_USER: aakatsuki
          MYSQL_PASSWORD: test-only
          MYSQL_ROOT_PASSWORD: test-only-root
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ptest-only-root"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tests avec SQLite
        run: npm test
      - name: Tests avec MySQL (utilisateur sans droits d'administration, comme chez un hébergeur)
        env:
          TEST_DATABASE_URL: mysql://aakatsuki:test-only@127.0.0.1:3306/aakatsuki_test
        run: node --disable-warning=ExperimentalWarning --test --test-concurrency=1 test/*.test.js

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
      APP_DIR: ${{ vars.APP_DIR || '~/aakatsuki' }}
      RELEASE: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      # Dépendances de production (pilote MySQL) installées ici et envoyées avec la version
      - run: npm ci --omit=dev
      - name: Vérifier la configuration
        run: |
          if [ -z "$VPS_HOST" ] || [ -z "$VPS_USER" ]; then
            echo "::error::Secrets VPS_HOST, VPS_USER et VPS_SSH_KEY manquants (Settings > Environments > production)."
            exit 1
          fi
      - name: Clé SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          # Empreinte du serveur enregistrée en secret : protège contre une usurpation du VPS
          if [ -n "$VPS_KNOWN_HOSTS" ]; then printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else ssh-keyscan -p "$VPS_PORT" "$VPS_HOST" > ~/.ssh/known_hosts 2>/dev/null; echo "::warning::Ajoute le secret VPS_KNOWN_HOSTS pour vérifier l'identité du VPS."; fi
      - name: Envoyer la nouvelle version
        run: |
          # Seulement les fichiers du site : ni tests, ni données, ni outils de déploiement
          tar czf - package.json package-lock.json node_modules index.html sw.js manifest.webmanifest css js assets server \
            | ssh -i ~/.ssh/deploy -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" \
              "set -e; R=$APP_DIR/releases/$RELEASE; rm -rf \$R; mkdir -p \$R; tar xzf - -C \$R"
      - name: Mettre en service
        run: |
          ssh -i ~/.ssh/deploy -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" \
            "APP_DIR=$APP_DIR RELEASE=$RELEASE bash -s" < deploy/activate.sh
